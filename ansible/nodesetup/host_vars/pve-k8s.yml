---
############
# Dev node 2 (pve-dev-2): k3s servers k8s-1 + k8s-2, one Postgres HA member
############

# --- Connection ----------------------------------------------------------
ansible_host: 192.168.129.102
ansible_ssh_user: root

# --- Placement -----------------------------------------------------------
proxmox_node: pve-dev-2
proxmox_storage: vm-dev

# If this node is in a DIFFERENT cluster from `pve`, give it its own API token
# here (otherwise it inherits proxmox_api_token_* from secret.all.yml):
#   proxmox_api_token_id:     "root@pam!ansible"
#   proxmox_api_token_secret: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# --- LXC containers on this node -----------------------------------------
cifs_mounts: []
lxc_containers:
  - hostname: postgres-pve-dev-2
    ctid: 227
    template: "{{ debian_lxc_template }}"
    memory: 4096
    cores: 2
    rootfs_gb: 64
    ipconfig: "192.168.129.135/23,gw=192.168.128.1"
    privileged: false
    autostart: true

# --- VMs on this node ----------------------------------------------------
# cloud-init injects your ~/.ssh/id_rsa.pub automatically. VMIDs are
# cluster-wide unique — keep them clear of prod (125 / 223 / 224).
vms:
  # k3s servers (embedded etcd); k8s-3 is on pve-dev. All three run workloads.
  - name: k8s-1
    vmid: 130
    cores: 3
    memory: 14336                       # MB
    disk_gb: 40
    data_disk_gb: 60                    # scsi1, mounted at /var/lib/longhorn
    ciuser: susu
    autostart: true
    ipconfig0: "ip=192.168.129.130/23,gw=192.168.128.1"

  - name: k8s-2
    vmid: 131
    cores: 3
    memory: 14336
    disk_gb: 40
    data_disk_gb: 60
    ciuser: susu
    autostart: true
    ipconfig0: "ip=192.168.129.131/23,gw=192.168.128.1"
