services:

  portainer-agent:
    image: portainer/agent:3.1.0
    restart: unless-stopped
    environment:
      - TZ={{ timezone }}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - "{{ services_ip }}:9001:9001"
    labels:
      - wud.tag.include=^\d+\.\d+\.\d+$$

  socket-proxy:
    image: linuxserver/socket-proxy:3.4.7
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - VERSION=1
      - EVENTS=1
      - INFO=1
      - NETWORKS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "{{ services_ip }}:2375:2375"
