services:

  shelfmark:
    image: ghcr.io/calibrain/shelfmark:v1.7.0
    restart: unless-stopped
    environment:
      FLASK_PORT: 8084
      LOG_LEVEL: info
      BOOK_LANGUAGE: fr,en
      USE_BOOK_TITLE: "true"
      TZ: "{{ timezone }}"
      APP_ENV: prod
      UID: "{{ docker.puid }}"
      GID: "{{ docker.pgid }}"
      CUSTOM_DNS: google
      USE_DOH: "true"
      USE_CF_BYPASS: "true"
      EXT_BYPASSER_URL: http://flaresolverr:8191
      PRIORITIZE_WELIB: "True"
    volumes:
      - "{{ docker.docker_dir }}/volumes/shelfmark:/config"
      - "{{ nas.mount }}/books/downloads:/books"
    networks:
      - proxy_network
      - indexer
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.shelfmark.loadbalancer.server.port=8084"
      - "traefik.http.routers.shelfmark.rule=Host(`shelfmark.{{ docker.domain }}`)"
      - "traefik.http.routers.shelfmark.entrypoints=websecure"

  shelfmark-maman:
    image: ghcr.io/calibrain/shelfmark:v1.7.0
    restart: unless-stopped
    environment:
      FLASK_PORT: 8084
      LOG_LEVEL: info
      BOOK_LANGUAGE: fr
      USE_BOOK_TITLE: "true"
      TZ: "{{ timezone }}"
      APP_ENV: prod
      UID: "{{ docker.puid }}"
      GID: "{{ docker.pgid }}"
      CUSTOM_DNS: google
      USE_DOH: "true"
    volumes:
      - "{{ nas.mount }}/books-maman/downloads:/books"
      - "{{ docker.docker_dir }}/volumes/shelfmark-2:/config"
    networks:
      - proxy_network
      - indexer

    labels:
      - "traefik.enable=true"
      - "traefik.http.services.shelfmark-maman.loadbalancer.server.port=8084"
      - "traefik.http.routers.shelfmark-maman.rule=Host(`shelfmark-maman.{{ docker.domain }}`)"
      - "traefik.http.routers.shelfmark-maman.entrypoints=websecure"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
    networks:
      - indexer

networks:
  proxy_network:
    external: true
  indexer:
