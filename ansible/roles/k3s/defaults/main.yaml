---
# k3s version to install. "" = latest stable channel; pin e.g. "v1.30.5+k3s1".
k3s_version: ""

# API server port that agents / extra servers join through.
k3s_api_port: 6443

# First server node — agents (and any extra servers) join through it.
# Uses the first k3s_server host's ansible_host (its IP), falling back to the
# inventory name if ansible_host isn't set.
k3s_control_node: "{{ hostvars[groups['k3s_server'][0]].ansible_host | default(groups['k3s_server'][0]) }}"

# Extra flags appended to the SERVER install (INSTALL_K3S_EXEC="server ...").
# e.g. "--disable traefik --disable servicelb" to bring your own ingress / LB.
k3s_server_extra_args: ""

# Extra flags appended to the AGENT install (INSTALL_K3S_EXEC="agent ...").
k3s_agent_extra_args: ""

# kubeconfig file mode on the NODE. Defaults to 600 (owner/root only), matching
# k3s — the file holds cluster-admin credentials, so it must not be
# world-readable. For non-root kubectl on the node, copy it to that user's
# ~/.kube/config (0600, owned by them) rather than relaxing this.
k3s_kubeconfig_mode: "600"

# Upstream DNS for pods (written to /etc/rancher/k3s/resolv.conf). Not the
# node's resolv.conf: with Tailscale MagicDNS that is 100.100.100.100, which
# pods cannot reach. LAN Pi-hole, same as lxc_nameserver in nodesetup.
k3s_pod_nameservers:
  - 192.168.129.47

# Built-in components switched off on servers (`disable:` in config.yaml).
# servicelb: kube-vip assigns LoadBalancer IPs instead (Homelab-k8S).
k3s_disable:
  - servicelb

# Longhorn data disk: the VM's scsi1 (proxmox-vm data_disk_gb), formatted ext4
# and mounted at /var/lib/longhorn. Stable path on Proxmox virtio-scsi.
k3s_longhorn_disk: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1

# kube-apiserver flags (servers, config.yaml). Pods leave an unreachable or
# not-ready node after 30 s instead of the default 300 s, so single-replica
# apps on a dead node come back elsewhere quickly. Only applies to pods created
# after the change (the toleration is added when a pod is admitted).
k3s_kube_apiserver_args:
  - default-not-ready-toleration-seconds=30
  - default-unreachable-toleration-seconds=30

# UFW rules (applied only where UFW is installed). Keep the CIDRs in step with
# --cluster-cidr / --service-cidr if those are ever set in *_extra_args.
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16
k3s_api_allowed_sources:
  - 192.168.128.0/23

# Pull the cluster kubeconfig back to the Ansible controller after install,
# rewriting 127.0.0.1 -> the control node IP so it works remotely.
k3s_fetch_kubeconfig: false
k3s_kubeconfig_local_path: "{{ playbook_dir }}/k3s-kubeconfig.yaml"
