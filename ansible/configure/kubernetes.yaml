---
# Install a k3s cluster on the k8s test nodes.
# Servers first (so the join token exists), then agents.
#
# Run from ansible/ (the k3s_* groups live in the dev inventory):
#   ansible-playbook -i configure/inventory-dev configure/kubernetes.yaml
#   ansible-playbook -i configure/inventory-dev configure/kubernetes.yaml -e k3s_fetch_kubeconfig=true

- name: Install k3s control-plane
  hosts: k3s_server
  become: true
  roles:
    - role: k3s
      tags: [k3s]

- name: Install k3s agents
  hosts: k3s_agent
  become: true
  roles:
    - role: k3s
      tags: [k3s]

# CoreDNS reads its upstream servers when the pod starts: restart it once,
# after every node has its new resolver file
- name: Restart CoreDNS after a resolver change
  hosts: k3s_server[0]
  become: true
  tasks:
    - name: Restart CoreDNS
      ansible.builtin.command: k3s kubectl -n kube-system rollout restart deployment/coredns
      when: >-
        groups['k3s'] | map('extract', hostvars, 'k3s_resolv_changed')
        | select('defined') | map('bool') | select | list | length > 0
      changed_when: true
      tags: [k3s, k3s-config]
