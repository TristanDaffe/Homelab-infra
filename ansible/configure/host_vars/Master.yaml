---

hostname: master
tailscale_ip: 100.108.226.73 # fill in after first Tailscale provisioning

mount_nas: true

#######################
# NAS
#######################

nas:
  share: //192.168.129.45/Tristan
  mount: /mnt/nas
  puid: 1000
  pgid: 1000
uid: 1000
gid: 1002

#######################
# Docker
#######################

docker:
  # Must be repeated here: this dict replaces group_vars' docker dict, and
  # without it the deploy-composes cleanup and stack retirement are skipped
  cleanup: true
  docker_dir: "/docker"
  domain: autostack.ovh
  subdomain: "master"
  cert_resolver: "ovh"
  puid: 1000
  pgid: 1000
  docker_networks:
    - proxy_network
  composes:
    - name: traefik
      compose: network.yaml
      volumes:
        - letsencrypt
      config:
        - file: traefik.yaml
          dst: letsencrypt/traefik.yaml
        - file: peers.yaml.j2
          dst: letsencrypt/peers.yaml

master_ip: "{{ services_ip }}"

traefik_peers:
  - "{{ hostvars['Media'].tailscale_ip }}"

#######################
# Monitoring
#######################

#######################
# Backup (UrBackup)
#######################

urbackup:
  server_host: urbackup
  backup_dirs:
    - "{{ docker.docker_dir }}/volumes"
  authkey: "{{ urbackup_authkeys.master }}" 
  user: "{{ urbackup_secret.user }}"
  pass: "{{ urbackup_secret.pass }}"

