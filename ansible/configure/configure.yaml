---
- name: Configure provisioned nodes
  hosts: all
  become: true

  roles:
    - role: security
      tags: [security]

    # - role: opkssh-server
    #   tags: [opkssh-server]

    - role: tailscale
      tags: [tailscale]

    - role: monitoring
      tags: [monitoring]
      when: "'Monitoring' in groups"

    - role: docker
      tags: [docker]
      when: "'postgres_ha' not in group_names"

    - role: nfs-server
      tags: [nfs-server]
      when: nfs_server_exports | default([]) | length > 0

    - role: deploy-composes
      tags: [deploy-composes]
      when: "'postgres_ha' not in group_names"

    - role: recap
      tags: [recap]

    - role: docker-maintenance
      tags: [docker-maintenance]
      when: "'postgres_ha' not in group_names"
